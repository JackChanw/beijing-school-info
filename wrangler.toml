name = "beijing-school-info"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "beijing-school-info-db"
database_id = "fb68a2d3-b3a2-4d66-95a6-ec7bab5c7943"

[[queues.producers]]
binding = "AI_QUEUE"
queue = "ai-reply-queue"

[[queues.consumers]]
queue = "ai-reply-queue"
max_batch_size = 1
max_retries = 2

[vars]
RELAY_BASE_URL = "https://bmc-llm-relay.nextblue.ai/v1"
RELAY_MODEL = "gpt-5.5"
